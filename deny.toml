# cargo-deny policy for mcsmp-rs. Run with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    {
        id = "RUSTSEC-2026-0381",
        reason = "webpki-roots 0.26.11 is a semver shim that re-exports webpki-roots 1.0.10, whose root set no longer includes the distrusted emSign root; tokio-tungstenite 0.30 still depends on the 0.26 shim."
    },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
